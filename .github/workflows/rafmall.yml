# Uruchamia screener i tracker na prawdziwych danych na serwerach GitHuba,
# bez włączonego komputera. Klucze: Settings -> Secrets and variables -> Actions.
# Repo jest publiczne, więc logi przebiegów też - dlatego nie ma tu portfela.
name: rafmall

on:
  workflow_dispatch:
    inputs:
      zadanie:
        description: "Co uruchomić"
        type: choice
        default: check
        options: [check, first_run, alerts, market, scan, screener, site, peek, dump]
      url:
        description: "Adresy stron dla zadania peek (po przecinku)"
        type: string
        default: "https://rafmall.ch"
      symbole:
        description: "Symbole dla zadania dump (po spacji)"
        type: string
        default: "ARB-USD NVDA"
      klik:
        description: "peek: teksty przycisków/zakładek do kliknięcia (rozdzielone |)"
        type: string
        default: ""
  schedule:
    # czas UTC; sesja USA to ok. 13:30-21:00 UTC
    # Minuta 17, nie 0: GitHub pomija przebiegi zaplanowane na pełną godzinę, gdy ma tłok
    # (13.10.2026 z 8 godzinnych alertów odbyły się 2).
    - cron: "17 14-21 * * 1-5"  # alerts
    - cron: "40 21 * * 1-5"     # market
    - cron: "50 21 * * 1-5"     # scan

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT: ${{ inputs.zadanie }}
      PEEK_URL: ${{ inputs.url }}
      DUMP_SYMBOLS: ${{ inputs.symbole }}
      PEEK_CLICKS: ${{ inputs.klik }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Wybierz zadanie
        id: pick
        run: |
          case "$SCHEDULE" in
            "17 14-21 * * 1-5") t=alerts ;;
            "40 21 * * 1-5")   t=market ;;
            "50 21 * * 1-5")   t=scan ;;
            *)                 t="${INPUT:-check}" ;;
          esac
          echo "zadanie=$t" >> "$GITHUB_OUTPUT"

      # Stan "co już zgłoszono" (.cache/*_seen.json) musi przetrwać między przebiegami.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: rafmall-cache-${{ github.run_id }}
          restore-keys: rafmall-cache-

      - name: Uruchom
        run: |
          [ -n "$FTP_DIR" ] || unset FTP_DIR
          case "${{ steps.pick.outputs.zadanie }}" in
            check)    python -m tracker check ;;
            # Pierwsze uruchomienie na prawdziwych danych: testy, validate 7 list, replay ARB,
            # alerty, scan, skan rynku (150 symboli), strona. Log w out/first_run_*.log (artifact).
            first_run) pip install -q pytest && python scripts/first_run.py ;;
            # Podgląd strony (rafmall.ch): tekst, nawigacja, kolory i zrzut ekranu do logu.
            # Notowania wybranych symboli do logu (CSV) - sesja bez sieci zapisuje je w data/samples/.
            dump) python -m tracker dump ${DUMP_SYMBOLS:-ARB-USD NVDA} --days 400 ;;
            peek) pip install -q playwright pillow && playwright install --with-deps chromium >/dev/null && python scripts/peek_site.py "${PEEK_URL:-https://rafmall.ch}" ;;
            alerts)   python -m tracker alerts --discord ;;
            market)   python -m tracker market --discord ;;
            scan)     python -m tracker scan --new-only --no-quotes ;;
            screener)
              python -m screener run --no-obsidian
              # Surowe pola TradingView dla trzech walut (w tym HK raportujące w CNY): kontrola jednostek.
              for t in 2330.TW 005930.KS 9880.HK; do python -m screener show "$t" --raw || true; done
              ;;
            site)
              python -m screener --provider yahoo --universe data/universe_humanoid_global.csv site --out out/site/roboty.html
              if [ -n "$FTP_HOST" ]; then python scripts/publish.py; else echo "Brak sekretów FTP - strona tylko jako plik do pobrania."; fi
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ steps.pick.outputs.zadanie }}-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
