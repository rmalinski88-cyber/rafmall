# Narzędzie online: liczy alerty, setupy i sygnały na prawdziwych danych, buduje strony
# (index, szukaj, okazje, inwestorzy, roboty) i publikuje je na GitHub Pages.
# Adres: https://rmalinski88-cyber.github.io/rafmall/
name: pages

on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 1-5"   # po sesji USA (UTC)
    - cron: "20 6 * * 1-6"    # rano CET, także w sobotę (krypto)
  push:
    branches: [main]
    paths: ["data/**", "tracker/**", "screener/**", "config/**", ".github/workflows/pages.yml"]

# Publikacja: push do gałęzi gh-pages (GitHub włącza Pages dla takiej gałęzi; gdyby nie,
# jedno kliknięcie: Settings → Pages → Source: Deploy from a branch → gh-pages / root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: rafmall-pages-${{ github.run_id }}
          restore-keys: |
            rafmall-pages-
            rafmall-cache-
      # Każdy krok danych może paść (limity Yahoo) bez blokowania publikacji reszty.
      - name: Alerty na listach
        continue-on-error: true
        run: python -m tracker alerts --all --no-remember
      - name: Setupy na całym rynku
        continue-on-error: true
        run: python -m tracker market --all --top 60 --no-remember
      - name: Inwestorzy (13F, Kongres, insiderzy)
        continue-on-error: true
        run: python -m tracker scan --no-quotes --no-remember
      - name: Strona robotyki
        continue-on-error: true
        run: |
          sig=$(ls out/signals_*.json 2>/dev/null | tail -1)
          python -m screener --universe data/universe_humanoid_global.csv site --out out/site/roboty.html \
            --extra "Surowce=data/universe_surowce.csv" --extra "Energia=data/universe_infrastruktura.csv" \
            --extra "Inne tematy=data/universe_inne.csv" ${sig:+--signals "$sig"}
      - name: Hub (szukaj, okazje, inwestorzy, api)
        run: |
          python -m tracker hub --site out/site
          touch out/site/.nojekyll
      - name: Publikuj (gałąź gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out/site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Narzędzie: dane z ${{ github.run_id }}"
